name: Source verification and security scans
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Enforce the standard-library dependency boundary
        run: python3 scripts/audit_python_dependencies.py
      - name: Install pip-audit
        run: python3 -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit declared Python dependencies
        id: audit
        shell: bash
        run: |
          : > "$RUNNER_TEMP/python-dependencies.txt"
          set +e
          pip-audit --requirement "$RUNNER_TEMP/python-dependencies.txt" \
            --format json --output pip-audit-results.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"
      - name: Convert pip-audit results to SARIF
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("pip-audit-results.json").read_text())
          vulnerabilities = audit.get("vulnerabilities", [])
          rules = {}
          results = []
          for vulnerability in vulnerabilities:
              rule_id = vulnerability["id"]
              description = vulnerability.get("description") or rule_id
              rules[rule_id] = {
                  "id": rule_id,
                  "shortDescription": {"text": rule_id},
                  "fullDescription": {"text": description},
                  "defaultConfiguration": {"level": "error"},
              }
              results.append({
                  "ruleId": rule_id,
                  "level": "error",
                  "message": {"text": description},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": "requirements.txt"},
                          "region": {"startLine": 1},
                      }
                  }],
              })
          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                  "tool": {"driver": {
                      "name": "pip-audit",
                      "informationUri": "https://github.com/pypa/pip-audit",
                      "rules": list(rules.values()),
                  }},
                  "results": results,
              }],
          }
          Path("pip-audit-results.sarif").write_text(json.dumps(sarif, indent=2))
          PY
      - name: Upload pip-audit results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit
      - name: Fail when vulnerable dependencies are found
        if: steps.audit.outputs.exit_code == '1'
        run: exit 1
  verify:
    name: Scheduled full verification
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: ./scripts/verify
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # ----------------------------------------------------------------------------
  # Trivy - Filesystem vulnerability scanning
  # Scans source code, dependencies, and configuration files
  # ----------------------------------------------------------------------------
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
